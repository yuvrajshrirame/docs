<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <style>
    .wireframe {
      fill: none;
      stroke: rgba(255, 255, 255, 0.04);
      stroke-width: 1.5;
    }
    .torus-outer {
      transform-origin: 500px 500px;
      animation: spinOuter 120s linear infinite;
    }
    .torus-inner {
      transform-origin: 500px 500px;
      animation: spinInner 60s linear infinite;
      stroke: rgba(255, 255, 255, 0.08); /* slightly brighter inner core */
    }
    @keyframes spinOuter { 100% { transform: rotate(360deg); } }
    @keyframes spinInner { 100% { transform: rotate(-360deg); } }
  </style>
  
  <g class="wireframe torus-outer">
    <!-- 24 interlocking geometric ellipses forming a massive 3D torus structure -->
    <ellipse cx="500" cy="260" rx="360" ry="160" transform="rotate(0 500 500)" />
    <ellipse cx="500" cy="260" rx="360" ry="160" transform="rotate(15 500 500)" />
    <ellipse cx="500" cy="260" rx="360" ry="160" transform="rotate(30 500 500)" />
    <ellipse cx="500" cy="260" rx="360" ry="160" transform="rotate(45 500 500)" />
    <ellipse cx="500" cy="260" rx="360" ry="160" transform="rotate(60 500 500)" />
    <ellipse cx="500" cy="260" rx="360" ry="160" transform="rotate(75 500 500)" />
    <ellipse cx="500" cy="260" rx="360" ry="160" transform="rotate(90 500 500)" />
    <ellipse cx="500" cy="260" rx="360" ry="160" transform="rotate(105 500 500)" />
    <ellipse cx="500" cy="260" rx="360" ry="160" transform="rotate(120 500 500)" />
    <ellipse cx="500" cy="260" rx="360" ry="160" transform="rotate(135 500 500)" />
    <ellipse cx="500" cy="260" rx="360" ry="160" transform="rotate(150 500 500)" />
    <ellipse cx="500" cy="260" rx="360" ry="160" transform="rotate(165 500 500)" />
    <ellipse cx="500" cy="260" rx="360" ry="160" transform="rotate(180 500 500)" />
    <ellipse cx="500" cy="260" rx="360" ry="160" transform="rotate(195 500 500)" />
    <ellipse cx="500" cy="260" rx="360" ry="160" transform="rotate(210 500 500)" />
    <ellipse cx="500" cy="260" rx="360" ry="160" transform="rotate(225 500 500)" />
    <ellipse cx="500" cy="260" rx="360" ry="160" transform="rotate(240 500 500)" />
    <ellipse cx="500" cy="260" rx="360" ry="160" transform="rotate(255 500 500)" />
    <ellipse cx="500" cy="260" rx="360" ry="160" transform="rotate(270 500 500)" />
    <ellipse cx="500" cy="260" rx="360" ry="160" transform="rotate(285 500 500)" />
    <ellipse cx="500" cy="260" rx="360" ry="160" transform="rotate(300 500 500)" />
    <ellipse cx="500" cy="260" rx="360" ry="160" transform="rotate(315 500 500)" />
    <ellipse cx="500" cy="260" rx="360" ry="160" transform="rotate(330 500 500)" />
    <ellipse cx="500" cy="260" rx="360" ry="160" transform="rotate(345 500 500)" />
  </g>

  <g class="wireframe torus-inner">
    <!-- 12 ellipses for the counter-rotating inner core -->
    <ellipse cx="500" cy="420" rx="120" ry="50" transform="rotate(0 500 500)" />
    <ellipse cx="500" cy="420" rx="120" ry="50" transform="rotate(30 500 500)" />
    <ellipse cx="500" cy="420" rx="120" ry="50" transform="rotate(60 500 500)" />
    <ellipse cx="500" cy="420" rx="120" ry="50" transform="rotate(90 500 500)" />
    <ellipse cx="500" cy="420" rx="120" ry="50" transform="rotate(120 500 500)" />
    <ellipse cx="500" cy="420" rx="120" ry="50" transform="rotate(150 500 500)" />
    <ellipse cx="500" cy="420" rx="120" ry="50" transform="rotate(180 500 500)" />
    <ellipse cx="500" cy="420" rx="120" ry="50" transform="rotate(210 500 500)" />
    <ellipse cx="500" cy="420" rx="120" ry="50" transform="rotate(240 500 500)" />
    <ellipse cx="500" cy="420" rx="120" ry="50" transform="rotate(270 500 500)" />
    <ellipse cx="500" cy="420" rx="120" ry="50" transform="rotate(300 500 500)" />
    <ellipse cx="500" cy="420" rx="120" ry="50" transform="rotate(330 500 500)" />
  </g>
</svg>
