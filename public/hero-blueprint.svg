<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <style>
    .node-core { fill: #ffffff; animation: pulseCore 4s ease-in-out infinite alternate; }
    .node-orbit { fill: #71717a; }
    .link-solid { stroke: #52525b; stroke-width: 1.5; }
    .link-dash { stroke: #71717a; stroke-width: 1; stroke-dasharray: 4 4; animation: march 20s linear infinite; }
    .link-thin { stroke: #3f3f46; stroke-width: 0.5; }
    
    @keyframes march {
      to { stroke-dashoffset: -100; }
    }
    @keyframes pulseCore {
      0% { r: 6; opacity: 0.8; }
      100% { r: 8; opacity: 1; }
    }
    @keyframes floatLayer {
      0% { transform: translateY(0px) rotate(0deg); }
      100% { transform: translateY(-10px) rotate(1deg); }
    }
    
    .assembly {
      transform-origin: 200px 200px;
      animation: floatLayer 8s ease-in-out infinite alternate;
    }
  </style>
  
  <g class="assembly">
    <!-- Concentric Hexagons (Architecture Blueprint Vibe) -->
    <polygon points="200,50 350,125 350,275 200,350 50,275 50,125" class="link-solid"/>
    <polygon points="200,80 320,140 320,260 200,320 80,260 80,140" class="link-dash"/>
    <polygon points="200,110 290,155 290,245 200,290 110,245 110,155" class="link-thin"/>

    <!-- Intersecting Flow Lines -->
    <line x1="200" y1="50" x2="200" y2="350" class="link-thin" />
    <line x1="50" y1="125" x2="350" y2="275" class="link-thin" />
    <line x1="50" y1="275" x2="350" y2="125" class="link-thin" />

    <!-- Outer Nodes -->
    <circle cx="200" cy="50" r="4" class="node-orbit" />
    <circle cx="350" cy="125" r="4" class="node-orbit" />
    <circle cx="350" cy="275" r="4" class="node-orbit" />
    <circle cx="200" cy="350" r="4" class="node-orbit" />
    <circle cx="50" cy="275" r="4" class="node-orbit" />
    <circle cx="50" cy="125" r="4" class="node-orbit" />
    
    <!-- Inner Nodes -->
    <circle cx="200" cy="80" r="3" class="node-orbit" fill="#52525b" />
    <circle cx="320" cy="140" r="3" class="node-orbit" fill="#52525b" />
    <circle cx="320" cy="260" r="3" class="node-orbit" fill="#52525b" />
    <circle cx="200" cy="320" r="3" class="node-orbit" fill="#52525b" />
    <circle cx="80" cy="260" r="3" class="node-orbit" fill="#52525b" />
    <circle cx="80" cy="140" r="3" class="node-orbit" fill="#52525b" />

    <!-- Core Node -->
    <circle cx="200" cy="200" r="6" class="node-core" />
  </g>
</svg>
